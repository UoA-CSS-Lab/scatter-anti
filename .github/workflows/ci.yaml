on:
  push:
    branches:
      - development
    tags:
      - v*
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_CONFIG_REGISTRY: https://npm.flatt.tech/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Setup Takumi Guard (npm)
        uses: flatt-security/setup-takumi-guard-npm@v1
      - name: Verify npm registry is Takumi Guard
        run: |
          actual="$(npm config get registry)"
          echo "registry=$actual"
          if [ "$actual" != "https://npm.flatt.tech/" ]; then
            echo "::error::npm is not routed through Takumi Guard (registry=$actual)"
            exit 1
          fi
      - uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: ${{ hashFiles('package-lock.json', 'examples/next/package-lock.json') }}
      - run: npm install
      - run: npm install --prefix examples/next
      - name: build
        run: npm run build
      - name: Verify build output ships in the npm tarball
        run: node scripts/check-package-files.mjs
      - name: lint
        run: npm run lint:all
      - name: test
        run: npm run test
      - uses: actions/cache/save@v5
        with:
          path: dist
          key: dist-${{ github.sha }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - ci
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        registry-url:
          - https://npm.pkg.github.com
          - https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        if: ${{ matrix.registry-url == 'https://npm.pkg.github.com' }}
        with:
          node-version: 20
          registry-url: ${{ matrix.registry-url }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        if: ${{ matrix.registry-url == 'https://registry.npmjs.org' }}
        with:
          node-version: 20
          registry-url: ${{ matrix.registry-url }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
      - uses: actions/cache/restore@v5
        with:
          path: dist
          key: dist-${{ github.sha }}
      - run: npm publish --registry ${{ matrix.registry-url }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ matrix.registry-url == 'https://npm.pkg.github.com' && secrets.GITHUB_TOKEN || secrets.NPMJS_TOKEN }}
